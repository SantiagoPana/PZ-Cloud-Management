name: Publish public website
on:
  push:
    branches: [development]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error
          url='https://api.github.com/repos/'+os.environ['GH_REPOSITORY']+'/pages'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          enabled=True
          try:
              with urllib.request.urlopen(request,timeout=30) as response: response.read()
          except urllib.error.HTTPError as error:
              if error.code!=404: raise
              enabled=False
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('enabled='+str(enabled).lower()+'\n')
          if not enabled:
              print('::notice::Website prepared. Enable Settings > Pages > Source: GitHub Actions, then run this workflow again.')
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary: summary.write('Website files are ready, but no public deployment was performed. Enable **Settings → Pages → Source: GitHub Actions**, then run **Publish public website** again.\n')
          PY
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Deploy public website
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
