name: Test and package
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Integration tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test.ps1
      - name: User-flow UI test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: java -Xms8m -Xmx768m -XX:+UseSerialGC -cp "build/classes;build/test-classes" pzcloud.UiSmoke
      - name: Consumer JAR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: java "-Djava.awt.headless=true" -cp "build/PZCloudManagement.jar;build/test-classes" pzcloud.BundledClientSmoke --consumer
      - name: Sign-in window test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: java -Xms8m -Xmx768m -XX:+UseSerialGC -cp "build/classes;build/test-classes" pzcloud.SignInUiSmoke
      - name: UI screenshots
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: PZCloud-2.3-UI
          path: |
            build/ui-smoke.png
            build/ui-v2-recover.png
            build/ui-google-sign-in.png
            build/ui-google-not-configured.png
          if-no-files-found: ignore
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/test.sh
      - name: Consumer JAR (Linux)
        if: runner.os == 'Linux'
        run: java -Djava.awt.headless=true -cp build/PZCloudManagement.jar:build/test-classes pzcloud.BundledClientSmoke --consumer
  windows-portable:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build native app with private Java runtime
        shell: pwsh
        env:
          PZCLOUD_GOOGLE_CLIENT_JSON: ${{ secrets.PZCLOUD_GOOGLE_CLIENT_JSON }}
        run: ./scripts/build.ps1 -Package
      - uses: actions/upload-artifact@v4
        with:
          name: PZCloudManagement-2.3-Windows-x64
          path: build/portable/PZCloudManagement/
          if-no-files-found: error
          retention-days: 30
