name: Test and package
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workshop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Lua 5.1 for the isolated mod tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes lua5.1
      - name: Test translations, UI states and protocol compatibility
        run: python3 scripts/test-mod.py
      - name: Package Workshop upload folder
        run: python3 scripts/package-workshop.py
      - uses: actions/upload-artifact@v4
        with:
          name: KnoxNet-Workshop-2.3.2
          path: build/workshop/KnoxNet-Workshop-2.3.2.zip
          if-no-files-found: error
          retention-days: 30
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Integration tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test.ps1
      - name: User-flow UI test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: java -Xms8m -Xmx768m -XX:+UseSerialGC -cp "build/classes;build/test-classes" pzcloud.UiSmoke
      - name: Consumer JAR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: java "-Djava.awt.headless=true" -cp "build/PZCloudManagement.jar;build/test-classes" pzcloud.BundledClientSmoke --consumer
      - name: Sign-in window test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: java -Xms8m -Xmx768m -XX:+UseSerialGC -cp "build/classes;build/test-classes" pzcloud.SignInUiSmoke
      - name: UI screenshots
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: KnoxNet-2.3.2-UI
          path: |
            build/ui-smoke.png
            build/ui-v2-recover.png
            build/ui-google-sign-in.png
            build/ui-google-not-configured.png
          if-no-files-found: ignore
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/test.sh
      - name: Consumer JAR (Linux)
        if: runner.os == 'Linux'
        run: java -Djava.awt.headless=true -cp build/PZCloudManagement.jar:build/test-classes pzcloud.BundledClientSmoke --consumer
  windows-portable:
    needs: [test, workshop]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build native app with private Java runtime
        shell: pwsh
        env:
          PZCLOUD_GOOGLE_CLIENT_JSON: ${{ secrets.PZCLOUD_GOOGLE_CLIENT_JSON }}
        run: ./scripts/build.ps1 -Package -RequireGoogleLogin
      - name: Launch packaged Windows runtime with isolated Google fixture
        shell: pwsh
        run: ./scripts/test-native-windows.ps1
      - name: Inspect executable integrity, signing and Defender availability
        shell: pwsh
        run: ./scripts/check-windows-security.ps1
      - name: Identify downloadable edition
        id: edition
        shell: pwsh
        run: |
          $status = Get-Content build/portable/KnoxNet/GOOGLE_AUTH_STATUS.json -Raw | ConvertFrom-Json
          $edition = if ($status.googleClientBundled) { 'Windows-Google' } else { 'Preview-local-only' }
          "name=KnoxNet-2.3.2-$edition" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.edition.outputs.name }}
          path: build/portable/KnoxNet/
          if-no-files-found: error
          retention-days: 30
